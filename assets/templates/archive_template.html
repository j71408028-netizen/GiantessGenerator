<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-rank="$rank_tier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title - 角色档案</title>
<style>$css</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <span class="logo">巨大娘档案<span class="logo-sep">/</span><span class="logo-name">$hero_name</span></span>
  <nav class="topnav">$nav</nav>
  <div class="search-box" title="搜索身体尺寸、报告与副本回放（按 / 聚焦）">
    <input id="archiveSearch" type="search" placeholder="搜索内容" autocomplete="off" spellcheck="false">
    <span id="searchCount" class="search-count"></span>
    <button type="button" id="searchPrev" title="上一个（Shift+Enter）" disabled>▲</button>
    <button type="button" id="searchNext" title="下一个（Enter）" disabled>▼</button>
  </div>
  <button type="button" id="themeBtn" title="切换亮/暗主题">🌙</button>
</div><div class="progress" id="scrollProgress"></div></header>
<div class="layout">
<aside class="sidebar">
  <div class="infobox">$infobox</div>
</aside>
<main>
  <section class="section$analysis_hidden" id="analysis">
    <h2>灾害分析<button type="button" id="anaHideBtn" class="sec-hide" title="隐藏本栏（可从顶部导航再次打开）">✕</button></h2>
    $analysis
  </section>
  <section class="section section-merged">
    <div class="sub-section" id="bio">
      <h2>人物简介</h2>
      $bio
    </div>
    <div class="sub-section" id="sizes">
      <h2>物理信息</h2>
      $sizes
    </div>
    <div class="sub-section" id="reports">
      <h2>测量报告</h2>
      $reports
    </div>
    <div class="sub-section" id="replays">
      <h2>事件记录</h2>
      $replays
    </div>
  </section>
</main>
</div>
<button type="button" id="backTop" title="回到顶部">↑</button>
<footer class="footer">由 GiantessWiki 导出于 $exported_at。可能含有未公开信息。</footer>
<script>$js</script>
</body>
</html>
